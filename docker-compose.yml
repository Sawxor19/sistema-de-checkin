services:
  mock-service:
    build: ./mock-service
    environment:
      PORT: '4000'
    ports: ['4000:4000']
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build: ./backend
    environment:
      PORT: '3000'
      CADASTRO_URL: http://mock-service:4000
      CADASTRO_TIMEOUT_MS: '5000'
      FRONTEND_ORIGIN: http://localhost:5180,http://127.0.0.1:5180
    ports: ['3000:3000']
    depends_on:
      mock-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
  web:
    build: ./frontend
    ports: ['5180:80']
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '--quiet', 'http://127.0.0.1/']
      interval: 5s
      timeout: 3s
      retries: 12
