name: Validar entrega
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            mock-service/package-lock.json
      - run: npm ci
      - run: npm run setup
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait --wait-timeout 180
      - run: node scripts/smoke-compose.mjs
      - name: Logs dos containers
        if: failure()
        run: docker compose logs --no-color
      - name: Encerrar containers
        if: always()
        run: docker compose down
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
